<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>{{ .Title }}</title>
  <style>
    :root {
      color-scheme: light dark;
      --bg: #fdfdfc;
      --fg: #222;
      --muted: #666;
      --accent: #2563eb;
      --border: #e5e5e5;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #16181d;
        --fg: #e6e6e6;
        --muted: #9a9a9a;
        --accent: #60a5fa;
        --border: #2c2f36;
      }
    }
    body {
      max-width: 42rem;
      margin: 0 auto;
      padding: 2rem 1rem;
      background: var(--bg);
      color: var(--fg);
      font: 1.0625rem/1.7 system-ui, sans-serif;
    }
    header {
      border-bottom: 1px solid var(--border);
      margin-bottom: 2rem;
    }
    header h1 a { color: var(--fg); }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }
    h2 { color: var(--muted); font-size: 1rem; text-transform: uppercase; letter-spacing: .05em; }
    article { border-bottom: 1px solid var(--border); }
    article h3 { margin: .75rem 0; }
    img { max-width: 100%; }
    pre { overflow-x: auto; padding: 1rem; border: 1px solid var(--border); border-radius: 6px; }
  </style>
</head>
<body>
  <header>
    <h1>
      <a href="{{ .Site.Home.RelPermalink }}">
        {{ .Site.Title }}
      </a>
    </h1>
  </header>

  <main>
    {{ if .IsHome }}
      <h2>Minhas postagens</h2>

      {{ range .Site.RegularPages }}
        <article>
          <h3>
            <a href="{{ .RelPermalink }}">
              {{ .Title }}
            </a>
          </h3>
        </article>
      {{ end }}

    {{ else }}
      {{ .Content }}
    {{ end }}
  </main>
</body>
</html>
